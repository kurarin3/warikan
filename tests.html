<!doctype html><html><head><meta charset="utf-8"><title>calc tests</title></head>
<body><pre id="out">running</pre>
<script type="module">
import { splitEqually, computeBalances, settle, sum, yen } from "./js/calc.js";
const log = [];
let failed = 0;
const norm = (v) => (v && typeof v === "object" && !Array.isArray(v))
  ? Object.fromEntries(Object.keys(v).sort().map((k) => [k, norm(v[k])])) : v;
const eq = (name, got, want) => {
  const ok = JSON.stringify(norm(got)) === JSON.stringify(norm(want));
  if (!ok) failed++;
  log.push(`${ok ? "PASS" : "FAIL"} ${name}` + (ok ? "" : `\n   got  ${JSON.stringify(got)}\n   want ${JSON.stringify(want)}`));
};

eq("equal split exact", splitEqually(1000, ["a","b"]), {a:500,b:500});
eq("equal split remainder", splitEqually(1000, ["a","b","c"]), {a:334,b:333,c:333});
eq("equal split sums to total", sum(splitEqually(9999, ["a","b","c","d","e","f","g"])), 9999);
eq("equal split empty", splitEqually(1000, []), {});

// 4人で20000円。実際の支払いはバラバラ、負担は均等割。
const items1 = [{
  title:"dinner", date:"2026-08-22", amount:20000,
  payers:{a:8000,b:5000,c:4000,d:3000},
  shares:splitEqually(20000,["a","b","c","d"])
}];
const bal1 = computeBalances(items1, ["a","b","c","d"]);
eq("balances 4-payer", Object.fromEntries(Object.values(bal1).map(r=>[r.id,r.balance])),
   {a:3000,b:0,c:-1000,d:-2000});
eq("balances sum to zero", Object.values(bal1).reduce((s,r)=>s+r.balance,0), 0);
eq("transfers 4-payer", settle(bal1), [{from:"d",to:"a",amount:2000},{from:"c",to:"a",amount:1000}]);

// 対象メンバーを一部だけにした場合
const items2 = [{amount:3000, payers:{a:3000}, shares:{b:1500,c:1500}}];
const bal2 = computeBalances(items2, ["a","b","c","d"]);
eq("partial participants", Object.fromEntries(Object.values(bal2).map(r=>[r.id,r.balance])),
   {a:3000,b:-1500,c:-1500,d:0});
eq("partial transfers", settle(bal2), [{from:"b",to:"a",amount:1500},{from:"c",to:"a",amount:1500}]);

// 個別指定の負担額
const items3 = [
  {amount:10000, payers:{a:10000}, shares:{a:1000,b:2000,c:3000,d:4000}},
  {amount:4000,  payers:{b:2000,c:2000}, shares:splitEqually(4000,["a","b","c","d"])}
];
const bal3 = computeBalances(items3, ["a","b","c","d"]);
eq("mixed balances sum to zero", Object.values(bal3).reduce((s,r)=>s+r.balance,0), 0);
eq("mixed transfers settle everyone",
   settle(bal3).reduce((m,t)=>{m[t.from]=(m[t.from]||0)-t.amount;m[t.to]=(m[t.to]||0)+t.amount;return m;},{}),
   Object.fromEntries(Object.values(bal3).filter(r=>r.balance!==0).map(r=>[r.id,r.balance])));

// 削除されたメンバーが項目に残っていても集計に現れる
const bal4 = computeBalances([{amount:100, payers:{ghost:100}, shares:{a:100}}], ["a"]);
eq("unknown member included", Object.keys(bal4).sort(), ["a","ghost"]);

// --- 精算送金 ---
const items5 = [{ amount: 20000, payers: {a:8000,b:5000,c:4000,d:3000}, shares: splitEqually(20000,["a","b","c","d"]) }];
const bal5 = computeBalances(items5, ["a","b","c","d"], []);
eq("送金前の残り", settle(bal5), [{from:"d",to:"a",amount:2000},{from:"c",to:"a",amount:1000}]);

// 一部だけ送金した
const bal6 = computeBalances(items5, ["a","b","c","d"], [{from:"d",to:"a",amount:2000}]);
eq("送金1件ぶん差し引かれる", Object.fromEntries(Object.values(bal6).map(r=>[r.id,r.balance])),
   {a:1000,b:0,c:-1000,d:0});
eq("残りの送金だけになる", settle(bal6), [{from:"c",to:"a",amount:1000}]);

// 全部送金した
const bal7 = computeBalances(items5, ["a","b","c","d"],
  [{from:"d",to:"a",amount:2000},{from:"c",to:"a",amount:1000}]);
eq("全額送金で残高ゼロ", Object.values(bal7).every(r=>r.balance===0), true);
eq("全額送金で送金案なし", settle(bal7), []);

// 端数を分けて送金しても最後は合う
const bal8 = computeBalances(items5, ["a","b","c","d"],
  [{from:"d",to:"a",amount:500},{from:"d",to:"a",amount:1500},{from:"c",to:"a",amount:1000}]);
eq("分割送金でも残高ゼロ", Object.values(bal8).every(r=>r.balance===0), true);

// 渡しすぎた場合は逆向きの送金案が出る
const bal9 = computeBalances(items5, ["a","b","c","d"], [{from:"d",to:"a",amount:5000}]);
eq("渡しすぎたら逆向きになる", settle(bal9).some(t=>t.from==="a"&&t.to==="d"), true);
eq("渡しすぎても合計はゼロ", Object.values(bal9).reduce((s,r)=>s+r.balance,0), 0);

// 送金の内訳が記録される
eq("送金の内訳", [bal6.d.sentBack, bal6.a.receivedBack, bal6.d.balance], [2000, 2000, 0]);

// 項目がなく送金だけでも壊れない
const bal10 = computeBalances([], ["a","b"], [{from:"a",to:"b",amount:300}]);
eq("項目なし送金のみ", Object.fromEntries(Object.values(bal10).map(r=>[r.id,r.balance])), {a:300,b:-300});

// --- おつり ---
// 3600円の会計に a と b が 2000円ずつ出し、おつり 400円を b が受け取った。3人で均等割。
const items11 = [{ amount: 3600, payers: {a:2000,b:2000}, change: {b:400}, shares: splitEqually(3600,["a","b","c"]) }];
const bal11 = computeBalances(items11, ["a","b","c"]);
eq("おつりは受け取った人の立て替えから引かれる",
   Object.fromEntries(Object.values(bal11).map(r=>[r.id,r.balance])), {a:800,b:400,c:-1200});
eq("おつりがあっても合計はゼロ", Object.values(bal11).reduce((s,r)=>s+r.balance,0), 0);
eq("おつりの内訳", [bal11.b.paid, bal11.b.change, bal11.a.change], [2000, 400, 0]);

// 支払っていない人がおつりを受け取った場合は、その分だけ借りが増える
const bal12 = computeBalances(
  [{ amount: 3600, payers: {a:4000}, change: {c:400}, shares: splitEqually(3600,["a","b","c"]) }], ["a","b","c"]);
eq("支払っていない人がおつりを受け取る",
   Object.fromEntries(Object.values(bal12).map(r=>[r.id,r.balance])), {a:2800,b:-1200,c:-1600});
eq("おつり込みの送金案", settle(bal12), [{from:"c",to:"a",amount:1600},{from:"b",to:"a",amount:1200}]);

// おつりのない既存の項目はそのまま
eq("おつりなしは change が 0", bal1.a.change, 0);

eq("yen format", yen(1234567), "¥1,234,567");
eq("no transfers when settled", settle(computeBalances([{amount:100,payers:{a:100},shares:{a:100}}],["a"])), []);

document.title = failed ? `FAILED ${failed}` : "ALL PASS";
document.getElementById("out").textContent = log.join("\n") + `\n\n${failed ? failed + " FAILED" : "ALL PASS"}`;
</script></body></html>
